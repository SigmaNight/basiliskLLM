name: update translations from Crowdin
on:
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Generate the POT file in this run: artifacts from previous CI runs expire
  # after 30 days, which breaks the update when master has been idle.
  generate_pot:
    runs-on: windows-latest
    env:
      UV_NO_DEV: true
    steps:
      - name: checkout repository
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: setup uv
        uses: "astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d"
      - name: Install dependencies
        run: uv sync --frozen --group build
      - name: build POT file
        run: uv run setup.py extract_messages
      - name: upload POT file
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
        with:
          name: basiliskLLM.pot
          path: basiliskLLM.pot
          if-no-files-found: error
          retention-days: 1
          archive: false

  run:
    runs-on: ubuntu-latest
    needs: [generate_pot]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: checkout repository
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: download POT file
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
        with:
          name: basiliskLLM.pot
      - name: download translations
        uses: "crowdin/github-action@959dc74ac104447731cba99a016f85d0ae719788"
        with:
          upload_sources: false
          upload_translations: false
          config: "./crowdin.yml"
          download_translations: true
          localization_branch_name: "l10nUpdate"
          create_pull_request: true
          push_sources: true
          pull_request_base_branch_name: master
          pull_request_title: "chore: update translations"
          pull_request_body: "This PR updates translations file for basiliskLLM"
          pull_request_labels: "localization"
          commit_message: "chore: update translations file from Crowdin"
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
